[mod-setting-name]
linox-settings_elevator-boarding-alert=엘리베이터 탑승 알림 사용
linox-settings_enable-moshine-neodymium-recipe=[color=yellow]<호환성>[/color] Planet Moshine :: 네오디뮴 레시피 활성화
linox-settings_allow-hopper-launcher=[color=yellow]<호환성>[/color] Planet Hopper :: Hopper 설치 허용
linox-settings_compatibility-aai-signal-transmission=[color=yellow]<호환성>[/color] AAI Signal Transmission :: 리녹스와 연결
linox-settings_compatibility-distribution-request-planner=[color=yellow]<호환성>[/color] Distribution Request Planner :: 리녹스와 연결 

linox-settings_rbp-example-multiplay-language=재귀적 설계도면 예제 - 멀티플레이 언어 설정
linox-settings_rbp-example-local-language=재귀적 설계도면 예제 - 개인 언어 설정

linox-settings_easy-mode_remove-vanilla-circuit-collision=[color=green]<쉬움>[/color] 바닐라 회로 기기들의 충돌 상자 제거
linox-settings_easy-mode_anywhere-mantle-extractor=[color=green]<쉬움>[/color] 맨틀 추출기 표면 제한 제거
linox-settings_hard-mode_no-logistic-system=[color=red]<어려움>[/color] 물류 시스템 의존성 제거
linox-settings_hard-mode_no-starter-pack=[color=red]<어려움>[/color] 스타터 팩 제거
linox-settings_hard-mode_use-surface-condition=[color=red]<어려움>[/color] 리녹스 표면 제한 사용
linox-settings_hard-mode_enable-science-pack_aquilo=[color=red]<어려움>[/color] 리녹스 과학 팩을 아퀼로 테크 트리에서 사용
linox-settings_hard-mode_enable-science-pack_promethium=[color=red]<어려움>[/color] 리녹스 과학 팩을 프로메튬 테크 트리에서 사용

[mod-setting-description]
linox-settings_enable-moshine-neodymium-recipe=이 설정을 활성화 하면 모샤인 네오디뮴으로 네오디뮴 분말을 획득할 수 있습니다.
linox-settings_allow-hopper-launcher=이 설정을 활성화하면 리녹스에서 Hopper launcher의 배치가 허용되며, 터미널 플랫폼 타일 위에 Hopper launcher를 배치할 수 있게 됩니다.
linox-settings_compatibility-aai-signal-transmission=이 설정을 활성화하면 리녹스가 해당 모드를 제어하여 컨텐츠로 활용합니다.
linox-settings_compatibility-distribution-request-planner=이 설정을 활성화하면 리녹스가 해당 모드를 제어하여 컨텐츠로 활용합니다.

linox-settings_rbp-example-multiplay-language=이 설정은 재귀적 설계도면 예제의 설명문을 현지화 하기 위해 사용되며, 멀티플레이 시에만 사용됩니다. Auto로 설정하면 탐색된 첫 언어를 자동으로 사용합니다. 다른 국가의 언어로 설정하더라도 현지화 언어 캐시 상태에 따라 다른 언어가 표시될 수 있습니다.
linox-settings_rbp-example-local-language=이 설정은 재귀적 설계도면 예제의 설명문을 현지화 하기 위해 사용됩니다. Auto로 설정하면 현재 게임의 언어를 자동으로 사용합니다.  다른 국가의 언어로 설정하더라도 현지화 언어 캐시 상태에 따라 다른 언어가 표시될 수 있습니다.

linox-settings_easy-mode_anywhere-mantle-extractor=맨틀 추출기의 설치 제한을 제거합니다.
linox-settings_easy-mode_remove-vanilla-circuit-collision=바닐라 회로 기기들의 충돌 상자를 제거합니다. 충돌 상자가 제거되면 더 이상 이동을 방해하지 않습니다. 이 설정은 "squeak through 2" 모드가 로드 되면 작동하지 않습니다.
linox-settings_hard-mode_no-logistic-system=리녹스 행성 발견 연구에서 물류 시스템 연구 요구를 제거하고 초기 제공 아이템에서도 물류 시스템 관련 아이템들을 모두 삭제합니다.\n\n[color=yellow]주의 : 이 설정을 켜면 초반에 제공되는 예제를 제대로 작동시킬 수 없게 됩니다. 또한 이 설정은 리녹스 내의 물류 시스템 기술 의존성만 제거할 뿐이며, 게임에서 물류 시스템 기술을 원천적으로 제거하는 것은 아닙니다.[/color]
linox-settings_hard-mode_no-starter-pack=공장 부지를 개방한 직후에 주어지는 각종 초기 제공 아이템들을 모두 제거합니다. 게임을 진행하려면 플레이어는 모든 아이템들을 직접 조달 받아야만 합니다.
linox-settings_hard-mode_use-surface-condition=리녹스의 모든 최종 생산품을 리녹스에서만 제작할 수 있도록 표면 제한을 활성화 합니다.\n\n[color=yellow]주의 : 리녹스는 공간 제약이 크므로 해결하기 어려운 물류 병목을 겪을 수 있습니다.[/color]\n\n[color=red]위험 : 매우 고통스럽습니다![/color]
linox-settings_hard-mode_enable-science-pack_aquilo=리녹스 과학 팩 레시피를 활성화 하고 아퀼로 테크 트리에서 요구하도록 합니다.\n\n[color=yellow]주의 : 리녹스는 공간 제약이 크므로 해결하기 어려운 물류 병목을 겪을 수 있습니다.[/color]
linox-settings_hard-mode_enable-science-pack_promethium=리녹스 과학 팩 레시피를 활성화 하고 프로메튬 테크 트리에서 요구하도록 합니다.\n\n[color=yellow]주의 : 리녹스는 공간 제약이 크므로 해결하기 어려운 물류 병목을 겪을 수 있습니다.[/color]


