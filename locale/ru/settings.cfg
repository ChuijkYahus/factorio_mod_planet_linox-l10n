[mod-setting-name]
linox-settings_elevator-boarding-alert=Уведомление о посадке в лифт

linox-settings_enable-moshine-neodymium-recipe=[color=yellow]<Совместимость>[/color] Planet Moshine :: включить рецепт неодима
linox-settings_allow-hopper-launcher=[color=yellow]<Совместимость>[/color] Planet Hopper :: разрешить установку Hopper
linox-settings_compatibility-aai-signal-transmission=[color=yellow]<Совместимость>[/color] AAI Signal Transmission :: подключить к Linox
linox-settings_compatibility-distribution-request-planner=[color=yellow]<Совместимость>[/color] Distribution Request Planner :: подключить к Linox

linox-settings_rbp-example-multiplay-language=Пример рекурсивных чертежей — настройки языка для мультиплеера
linox-settings_rbp-example-local-language=Пример рекурсивных чертежей — персональные настройки языка

linox-settings_easy-mode_remove-vanilla-circuit-collision=[color=green]<Лёгкий режим>[/color] удалить коллизионные границы стандартных схемных устройств
linox-settings_easy-mode_anywhere-mantle-extractor=[color=green]<Лёгкий режим>[/color] снять ограничения поверхности для мантийного экстрактора

linox-settings_hard-mode_no-logistic-system=[color=red]<Сложный режим>[/color] убрать зависимость от логистической системы
linox-settings_hard-mode_no-starter-pack=[color=red]<Сложный режим>[/color] удалить стартовый набор
linox-settings_hard-mode_use-surface-condition=[color=red]<Сложный режим>[/color] использовать ограничения поверхности Linox
linox-settings_hard-mode_disable-mantle-extractor=[color=red]<Сложный режим>[/color] Отключить мантийный экстрактор
linox-settings_hard-mode_enable-science-pack_aquilo=[color=red]<Сложный режим>[/color] использовать научный пакет Linox в дереве технологий Aquilo
linox-settings_hard-mode_enable-science-pack_promethium=[color=red]<Сложный режим>[/color] использовать научный пакет Linox в дереве технологий Promethium
linox-settings_hard-mode_enable-science-pack_infinite=[color=red]<Сложный режим>[/color] Использовать научные пакеты Линокс в бесконечных исследованиях

[mod-setting-description]
linox-settings_enable-moshine-neodymium-recipe=Если этот параметр включён, из неодима Moshine можно будет получать неодимовый порошок.
linox-settings_allow-hopper-launcher=Если этот параметр включён, на Linox будет разрешена установка Hopper Launcher, в том числе на плитках терминальной платформы.
linox-settings_compatibility-aai-signal-transmission=Если этот параметр включён, Linox будет управлять этим модом и использовать его как часть игрового контента.
linox-settings_compatibility-distribution-request-planner=Если этот параметр включён, Linox будет управлять этим модом и использовать его как часть игрового контента.

linox-settings_rbp-example-multiplay-language=Этот параметр используется для локализации описаний примера рекурсивных чертежей и применяется только в многопользовательской игре. Если выбрано значение «Авто», автоматически используется первый обнаруженный язык. Даже если выбрать язык другой страны, в зависимости от состояния кэша локализации может отображаться другой язык.
linox-settings_rbp-example-local-language=Этот параметр используется для локализации описаний примера рекурсивных чертежей. Если выбрано значение «Авто», автоматически используется текущий язык игры. Даже если выбрать язык другой страны, в зависимости от состояния кэша локализации может отображаться другой язык.

linox-settings_easy-mode_anywhere-mantle-extractor=Снимает ограничения на размещение мантийного экстрактора.
linox-settings_easy-mode_remove-vanilla-circuit-collision=Удаляет коллизионные границы стандартных схемных устройств. После этого они больше не будут препятствовать передвижению. Этот параметр не действует, если загружен мод «Squeak Through 2».
linox-settings_hard-mode_no-logistic-system=Убирает требование исследования логистической системы из исследования открытия планеты Linox, а также удаляет все связанные с логистической системой предметы из стартового набора.\n\n[color=yellow]Внимание: при включении этого параметра пример, выдаваемый в начале игры, больше не будет работать корректно. Кроме того, этот параметр удаляет зависимость от технологий логистической системы только внутри Linox и не удаляет саму технологию логистической системы из игры.[/color]
linox-settings_hard-mode_no-starter-pack=Удаляет все стартовые предметы, выдаваемые сразу после открытия промышленной площадки. Для прохождения игроку придётся самостоятельно получить все необходимые предметы.
linox-settings_hard-mode_use-surface-condition=Включает ограничения поверхности, из-за которых вся конечная продукция Linox может производиться только на самой планете Linox.\n\n[color=yellow]Внимание: из-за ограниченного пространства на Linox вы можете столкнуться с очень сложными логистическими узкими местами.[/color]\n\n[color=red]Опасно: это действительно очень тяжело![/color]
linox-settings_hard-mode_disable-mantle-extractor=Удаляет мантийный экстрактор и все связанные с ним исследования.
linox-settings_hard-mode_enable-science-pack_aquilo=Включает рецепт научного пакета Linox и делает его обязательным для дерева технологий Aquilo.\n\n[color=yellow]Внимание: из-за ограниченного пространства на Linox вы можете столкнуться с очень сложными логистическими узкими местами.[/color]
linox-settings_hard-mode_enable-science-pack_promethium=Включает рецепт научного пакета Linox и делает его обязательным для дерева технологий Promethium.\n\n[color=yellow]Внимание: из-за ограниченного пространства на Linox вы можете столкнуться с очень сложными логистическими узкими местами.[/color]
linox-settings_hard-mode_enable-science-pack_infinite=При использовании научных пакетов Линокс в технологических деревьях Аквило и Прометия научные пакеты Линокс также потребуются для бесконечных исследований.\n\n[color=yellow]Внимание: Из-за серьёзных ограничений пространства на Линокс вы можете столкнуться с трудноразрешимыми логистическими узкими местами.[/color]



