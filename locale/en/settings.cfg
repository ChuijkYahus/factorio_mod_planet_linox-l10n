linox-settings_hard-mode_enable-science-pack_aquilo=[color=red]<Hard>[/color] Use Linox Science Pack in the Aquilo Tech Tree
linox-settings_hard-mode_enable-science-pack_promethium=[color=red]<Hard>[/color] Use Linox Science Pack in the Promethium Tech Tree

[mod-setting-description]
linox-settings_enable-moshine-neodymium-recipe=When enabled, Neodymium Powder can be obtained from Planet Moshine's Neodymium.
linox-settings_allow-hopper-launcher=When enabled, Hopper Launchers can be placed on Linox, including on Terminal Platform Tiles.
linox-settings_compatibility-aai-signal-transmission=When enabled, Linox will take control of this mod and integrate it into its gameplay.
linox-settings_compatibility-distribution-request-planner=When enabled, Linox will take control of this mod and integrate it into its gameplay.

linox-settings_rbp-example-multiplay-language=This setting is used to localize the descriptions in the Recursive Blueprint Example and is only used in multiplayer. If set to Auto, the first detected language will be used automatically. Even if you select another language, a different language may be displayed depending on the localization cache.
linox-settings_rbp-example-local-language=This setting is used to localize the descriptions in the Recursive Blueprint Example. If set to Auto, the current game language will be used automatically. Even if you select another language, a different language may be displayed depending on the localization cache.

linox-settings_easy-mode_anywhere-mantle-extractor=Removes the placement restrictions for Mantle Extractors.
linox-settings_easy-mode_remove-vanilla-circuit-collision=Removes the collision boxes from vanilla circuit entities so they no longer block movement. This setting has no effect if the "Squeak Through 2" mod is loaded.
linox-settings_hard-mode_no-logistic-system=Removes the Logistic System research requirement from the Linox Planet Discovery technology and removes all logistic-related items from the starting equipment.\n\n[color=yellow]Warning: Enabling this setting will prevent the starter examples from functioning correctly. It only removes Logistic System dependencies within Linox and does not remove the Logistic System technology from the game itself.[/color]
linox-settings_hard-mode_no-starter-pack=Removes all starter items normally granted after unlocking the factory site. Players must acquire every item themselves in order to progress.
linox-settings_hard-mode_use-surface-condition=Enables surface restrictions so that all final Linox products can only be crafted on Linox.\n\n[color=yellow]Warning: Due to Linox's limited space, you may encounter severe logistics bottlenecks that are difficult to solve.[/color]\n\n[color=red]Danger: This is extremely painful![/color]
linox-settings_hard-mode_disable-mantle-extractor=Removes the Mantle Extractor and all related research.
linox-settings_hard-mode_enable-science-pack_aquilo=Enables the Linox Science Pack recipe and requires it in the Aquilo tech tree.\n\n[color=yellow]Warning: Due to Linox's limited space, you may encounter severe logistics bottlenecks that are difficult to solve.[/color]
linox-settings_hard-mode_enable-science-pack_promethium=Enables the Linox Science Pack recipe and requires it in the Promethium tech tree.\n\n[color=yellow]Warning: Due to Linox's limited space, you may encounter severe logistics bottlenecks that are difficult to solve.[/color]

