linox-settings_rbp-example-multiplay-language=Recursive Blueprint Example - Multiplayer Language
linox-settings_rbp-example-local-language=Recursive Blueprint Example - Personal Language

linox-settings_easy-mode_remove-vanilla-circuit-collision=[color=green]<Easy>[/color] Remove Collision Boxes from Vanilla Circuit Entities
linox-settings_easy-mode_anywhere-mantle-extractor=[color=green]<Easy>[/color] Remove Surface Restriction for Mantle Extractors
linox-settings_hard-mode_no-logistic-system=[color=red]<Hard>[/color] Remove Dependency on the Logistic System
linox-settings_hard-mode_no-starter-pack=[color=red]<Hard>[/color] Remove Starter Pack
